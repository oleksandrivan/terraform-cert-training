# Upstream GatewayClass from aws/aws-application-networking-k8s.
# Apply on a second terraform apply after the controller CRDs exist
# (create_gateway_class = true).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: GatewayClass
metadata:
  name: amazon-vpc-lattice
spec:
  controllerName: application-networking.k8s.aws/gateway-api-controller
